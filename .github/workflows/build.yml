name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Validate JSON resources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("src/main/resources/fabric.mod.json"),
              Path("src/main/resources/data/thethingthatlearnedyou/dimension/fake_overworld.json"),
              Path("src/main/resources/assets/thethingthatlearnedyou/lang/en_us.json"),
          ]
          for file in files:
              with file.open(encoding="utf-8") as stream:
                  json.load(stream)
              print(f"Valid JSON: {file}")
          PY

      - name: Build mod
        run: gradle --no-daemon --stacktrace clean build

      - name: Stage and validate installable JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR_PATH"
          jar tf "$JAR_PATH" | grep -qx 'fabric.mod.json'
          unzip -p "$JAR_PATH" fabric.mod.json | python3 -m json.tool >/dev/null
          mkdir -p dist
          cp "$JAR_PATH" dist/
          echo "Installable JAR staged: $(basename "$JAR_PATH")"

      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: the-thing-that-learned-you-26.1.2
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
